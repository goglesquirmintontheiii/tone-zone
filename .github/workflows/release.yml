name: Build & release AppImage

# A GitHub release is created automatically for every new version: bump "version" in app/package.json,
# push to main, and this workflow builds the AppImage and publishes release v<version>
# (notes from docs/releases/v<version>.md when present). The Raspberry Pi bundle (aarch64 engine, agent,
# screen UI, installer) is built next to it and attached to the same release. It is signed when the
# TZ_PI_SIGNING_KEY secret holds the Ed25519 private key (see docs/raspberry-pi.md).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    runs-on: ubuntu-24.04
    outputs:
      exists: ${{ steps.ver.outputs.exists }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./app/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1 && [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" != "tag" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release v$V already exists - nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.ver.outputs.exists == 'false'
        with:
          node-version: 22
      - name: Toolchain
        if: steps.ver.outputs.exists == 'false'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: Build DSP engine (x86-64-v2 + v3)
        if: steps.ver.outputs.exists == 'false'
        run: ./scripts/build-engine.sh
      - name: Engine self-test
        if: steps.ver.outputs.exists == 'false'
        run: ./engine/dist/tonezone-engine-v2 --list > /dev/null
      - name: Build AppImage
        if: steps.ver.outputs.exists == 'false'
        working-directory: app
        run: |
          npm ci
          npx electron-builder --linux AppImage --publish never
      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          NOTES="docs/releases/v$V.md"
          [ -f "$NOTES" ] || echo "Tone Zone v$V" > "$NOTES"
          if ! gh release view "v$V" >/dev/null 2>&1; then
            gh release create "v$V" --target "$GITHUB_SHA" --title "Tone Zone v$V" --notes-file "$NOTES"
          fi
          gh release upload "v$V" app/dist/*.AppImage --clobber

  # Raspberry Pi: cross compiled on Ubuntu 22.04, whose glibc (2.35) is older than Pi OS Bookworm's (2.36), so the
  # binaries run there. TZ_MAX_GLIBC fails the build if that ever slips.
  pi-bundle:
    needs: appimage
    if: needs.appimage.outputs.exists == 'false'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain
        run: |
          sudo apt-get update > /tmp/apt.log 2>&1 && sudo apt-get install -y --no-install-recommends cmake make g++-aarch64-linux-gnu gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user >> /tmp/apt.log 2>&1 || { echo "::error title=toolchain::$(tail -c 1500 /tmp/apt.log | tr '\n' '|')"; exit 1; }
      - name: Build DSP engine (aarch64, Cortex-A53 baseline for Pi 3B+ / 4 / 5)
        # failures post the end of the log as an annotation (job logs are not always reachable)
        run: |
          set -o pipefail
          TZ_MAX_GLIBC=2.36 ./scripts/build-engine.sh arm64 2>&1 | tee /tmp/build.log || { echo "::error title=arm build::$(grep -i -m3 -B2 -A8 'error' /tmp/build.log | tail -c 1800 | tr '\n' '|')"; exit 1; }
      - name: Engine self-test under qemu
        run: |
          set -o pipefail
          { qemu-aarch64 -L /usr/aarch64-linux-gnu ./engine/dist-pi/tonezone-engine-arm64 --list > /dev/null && node scripts/pi-qemu-selftest.js; } 2>&1 | tee /tmp/st.log || { echo "::error title=self test::$(tail -c 1500 /tmp/st.log | tr '\n' '|')"; exit 1; }
      - name: Build Pi bundle
        env:
          TZ_PI_SIGNING_KEY: ${{ secrets.TZ_PI_SIGNING_KEY }}
        run: |
          set -o pipefail
          ./scripts/pi-bundle.sh "${{ needs.appimage.outputs.version }}" 2>&1 | tee /tmp/bundle.log || { echo "::error title=bundle::$(tail -c 1500 /tmp/bundle.log | tr '\n' '|')"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: pi-bundle
          path: dist-pi/

  pi-release:
    needs: [appimage, pi-bundle]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pi-bundle
          path: dist-pi
      - name: Attach Pi bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.appimage.outputs.version }}" dist-pi/* --clobber
