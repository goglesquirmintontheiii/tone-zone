name: Build & release AppImage

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: Build DSP engine (x86-64-v2 + v3)
        run: ./scripts/build-engine.sh
      - name: Engine self-test
        run: ./engine/dist/tonezone-engine-v2 --list > /dev/null
      - name: Build AppImage
        working-directory: app
        run: |
          npm ci
          npx electron-builder --linux AppImage --publish never
      - name: Publish to the release for this tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Tone Zone ${TAG}" --notes "Automated build of ${TAG}."
          gh release upload "$TAG" app/dist/*.AppImage --clobber
